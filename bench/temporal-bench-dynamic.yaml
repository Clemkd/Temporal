# Rate limits raised so the benchmark measures Temporal + Postgres, not the frontend rate limiter
# (defaults: 2400 RPS per frontend / namespace).
frontend.rps:
  - value: 100000
frontend.namespaceRPS:
  - value: 100000
frontend.namespaceCount:
  - value: 100000
history.rps:
  - value: 100000
limit.maxIDLength:
  - value: 1000
